site_name: Portafolio de Actividades
site_description: Portafolio de prácticas de Sistemas Embebidos y Mecatrónica — Universidad Iberoamericana Puebla
repo_url: https://github.com/Andrik-09/SisitemasEmbebidosAyM
repo_name: Andrik-09/SisitemasEmbebidosAyM
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.critic:
      mode: view
  - pymdownx.caret
  - pymdownx.keys
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - admonition
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
# Use the ReadTheDocs theme
theme:
  name: material
  highlightjs: true
  palette:
      - scheme: default
        primary: black
        accent: red

  features:
    - content.code.copy
    - content.tooltips
    - navigation.top
    - navigation.tracking
nav:
  - Inicio: index.md
  - Equipo: index.md#equipo
  - Prácticas: index.md#practicas
  - Encabezados: comandos.md
  - Ejemplo de Documentación: ejemplo.md
  - Comandos básicos de Git: gitcmds.md
validation:
  nav:
    # Los anclas #equipo / #practicas viven dentro de HTML crudo
    # (md_in_html), así que MkDocs no puede verificarlas por sí solo.
    not_found: ignore
extra_css:
  - https://use.fontawesome.com/releases/v6.5.2/css/all.css
  - https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css
  - stylesheets/extra.css
extra_javascript:
  - javascripts/portfolio.js

