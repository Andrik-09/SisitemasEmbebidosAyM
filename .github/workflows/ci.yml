name: ci
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material

      - name: Construir sitio con MkDocs
        run: mkdocs build --clean

      - name: Publicar sitio construido en main (root) para GitHub Pages
        run: |
          set -e
          GENERATED_PATHS=".nojekyll 404.html index.html sitemap.xml sitemap.xml.gz assets stylesheets javascripts recursos search comandos ejemplo gitcmds"
          touch site/.nojekyll
          for p in $GENERATED_PATHS; do
            rm -rf "./$p"
          done
          cp -r site/. .
          rm -rf site
          git add -A -- $GENERATED_PATHS
          if git diff --cached --quiet; then
            echo "Sin cambios en el sitio publicado, no se crea commit."
          else
            git commit -m "chore: publicar sitio construido en main/root [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Publicar también en la rama gh-pages (respaldo)
        run: mkdocs gh-deploy --force